[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-emotion-local"
version = "0.1.0"
description = "Local-first Hinglish sentiment, emoji, sarcasm, and uncertainty pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "torch>=2.2",
  "transformers>=4.45",
  "scikit-learn>=1.4",
]

[project.scripts]
hinglish-emotion = "hinglish_emotion.cli:main"

[tool.setuptools.packages.find]
include = ["hinglish_emotion*"]

